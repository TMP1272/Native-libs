name: Build AAPT2 with Docker

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target_arch: [arm64-v8a, armeabi-v7a, x86_64, x86]
    
    steps:
      - name: Build AAPT2 in Docker
        run: |
          cat > Dockerfile << 'EOF'
          FROM ubuntu:22.04
          
          RUN apt-get update && apt-get install -y \
            git gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 libncurses5 \
            libx11-dev libxml2-utils xsltproc unzip \
            python3 repo openjdk-17-jdk \
            && rm -rf /var/lib/apt/lists/*
          
          # Clone AOSP source
          RUN mkdir /aosp && cd /aosp && \
              repo init -u https://android.googlesource.com/platform/manifest -b main --depth=1 && \
              repo sync -c -j4 platform/frameworks/base platform/build platform/build/soong platform/prebuilts/build-tools
          
          WORKDIR /aosp
          
          # Build aapt2
          RUN source build/envsetup.sh && \
              lunch aosp_arm64-eng && \
              make aapt2 -j4
          EOF
          
          docker build -t aapt2-builder .
          
          # Extract binary cho từng architecture
          for arch in ${{ join(matrix.target_arch, ' ') }}; do
            docker create --name aapt2-$arch aapt2-builder
            docker cp aapt2-$arch:/aosp/out/host/linux-x86/bin/aapt2 aapt2-$arch
            docker rm aapt2-$arch
          done
          
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aapt2-${{ matrix.target_arch }}
          path: aapt2-${{ matrix.target_arch }}          set -e
          
          TARGET_ARCH=$1
          NDK_PATH=$ANDROID_NDK
          
          echo "Building AAPT2 for ${TARGET_ARCH}..."
          
          # Xác định triple cho NDK
          case ${TARGET_ARCH} in
            x86_64)
              TRIPLE="x86_64-linux-android"
              ;;
            x86)
              TRIPLE="i686-linux-android"
              ;;
            arm64-v8a)
              TRIPLE="aarch64-linux-android"
              ;;
            armeabi-v7a)
              TRIPLE="armv7a-linux-androideabi"
              ;;
            *)
              echo "Unsupported architecture: ${TARGET_ARCH}"
              exit 1
              ;;
          esac
          
          # Tạo thư mục build
          mkdir -p build/${TARGET_ARCH}
          cd build/${TARGET_ARCH}
          
          # Cấu hình CMake với NDK toolchain
          cmake ../../frameworks/base/tools/aapt2 \
            -DCMAKE_TOOLCHAIN_FILE=${NDK_PATH}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${TARGET_ARCH} \
            -DANDROID_PLATFORM=android-30 \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_STL=c++_shared
          
          # Build
          make -j$(nproc)
          
          # Copy kết quả
          cp aapt2 ${GITHUB_WORKSPACE}/build/bin/aapt2-${TARGET_ARCH}
          echo "✅ Built aapt2 for ${TARGET_ARCH}"
          EOF
          
          chmod +x build.sh
          
          # Tạo thư mục output
          mkdir -p build/bin

      - name: Compile aapt2
        env:
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          bash ./build.sh ${{ matrix.target_arch }}
          
          # Kiểm tra kết quả
          if [ ! -f "build/bin/aapt2-${{ matrix.target_arch }}" ]; then
            echo "⚠️ Binary not found, trying alternative build method..."
            
            # Phương pháp dự phòng: dùng prebuilt cho x86_64
            if [ "${{ matrix.target_arch }}" == "x86_64" ]; then
              # Tải prebuilt từ Google Maven
              VERSION=$(curl -s https://dl.google.com/android/maven2/com/android/tools/build/aapt2/maven-metadata.xml | grep -oP '(?<=<latest>)[^<]+')
              wget "https://dl.google.com/dl/android/maven2/com/android/tools/build/aapt2/${VERSION}/aapt2-${VERSION}-linux.jar"
              unzip -q "aapt2-${VERSION}-linux.jar" -d /tmp/aapt2
              cp /tmp/aapt2/aapt2 build/bin/aapt2-${{ matrix.target_arch }}
              rm -rf /tmp/aapt2
              echo "✅ Used prebuilt for x86_64"
            fi
          fi

      - name: Verify binary
        run: |
          if [ -f "build/bin/aapt2-${{ matrix.target_arch }}" ]; then
            echo "✅ Binary size: $(ls -lh build/bin/aapt2-${{ matrix.target_arch }} | awk '{print $5}')"
            file build/bin/aapt2-${{ matrix.target_arch }}
            chmod +x build/bin/aapt2-${{ matrix.target_arch }}
          else
            echo "❌ Failed to build aapt2 for ${{ matrix.target_arch }}"
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aapt2-${{ matrix.target_arch }}
          path: ${{ github.workspace }}/build/bin/aapt2-*
          if-no-files-found: error
          retention-days: 30
