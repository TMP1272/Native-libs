name: Build AAPT2 Latest Version

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev
  schedule:
    - cron: '0 0 * * 0'  # Chạy mỗi Chủ nhật để lấy phiên bản mới nhất

jobs:
  build:
    name: Build AAPT2 for ${{ matrix.target_arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target_arch: [x86_64, x86, arm64-v8a, armeabi-v7a]
      fail-fast: false
    
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: aosp-mirror/platform_frameworks_base
          path: frameworks/base
          submodules: false
          depth: 1

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Setup Java (required for AAPT2)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git gnupg flex bison zip curl \
            zlib1g-dev libc6-dev-i386 libncurses5 libncurses-dev \
            x11proto-core-dev libx11-dev libgl1-mesa-dev libxml2-utils \
            xsltproc unzip fontconfig python3

      - name: Get latest AAPT2 source version
        run: |
          cd frameworks/base/tools/aapt2
          echo "Building AAPT2 from latest source..."
          
          # Lấy commit mới nhất của nhánh main
          git fetch origin main --depth=1
          git checkout origin/main
          COMMIT_HASH=$(git rev-parse --short HEAD)
          echo "AAPT2_COMMIT=${COMMIT_HASH}" >> $GITHUB_ENV
          
      - name: Create build script
        run: |
          cat > build.sh << 'EOF'
          #!/bin/bash
          set -e
          
          TARGET_ARCH=$1
          NDK_PATH=$ANDROID_NDK
          
          echo "Building AAPT2 for ${TARGET_ARCH}..."
          
          # Xác định triple cho NDK
          case ${TARGET_ARCH} in
            x86_64)
              TRIPLE="x86_64-linux-android"
              ;;
            x86)
              TRIPLE="i686-linux-android"
              ;;
            arm64-v8a)
              TRIPLE="aarch64-linux-android"
              ;;
            armeabi-v7a)
              TRIPLE="armv7a-linux-androideabi"
              ;;
            *)
              echo "Unsupported architecture: ${TARGET_ARCH}"
              exit 1
              ;;
          esac
          
          # Tạo thư mục build
          mkdir -p build/${TARGET_ARCH}
          cd build/${TARGET_ARCH}
          
          # Cấu hình CMake với NDK toolchain
          cmake ../../frameworks/base/tools/aapt2 \
            -DCMAKE_TOOLCHAIN_FILE=${NDK_PATH}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${TARGET_ARCH} \
            -DANDROID_PLATFORM=android-30 \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_STL=c++_shared
          
          # Build
          make -j$(nproc)
          
          # Copy kết quả
          cp aapt2 ${GITHUB_WORKSPACE}/build/bin/aapt2-${TARGET_ARCH}
          echo "✅ Built aapt2 for ${TARGET_ARCH}"
          EOF
          
          chmod +x build.sh
          
          # Tạo thư mục output
          mkdir -p build/bin

      - name: Compile aapt2
        env:
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          bash ./build.sh ${{ matrix.target_arch }}
          
          # Kiểm tra kết quả
          if [ ! -f "build/bin/aapt2-${{ matrix.target_arch }}" ]; then
            echo "⚠️ Binary not found, trying alternative build method..."
            
            # Phương pháp dự phòng: dùng prebuilt cho x86_64
            if [ "${{ matrix.target_arch }}" == "x86_64" ]; then
              # Tải prebuilt từ Google Maven
              VERSION=$(curl -s https://dl.google.com/android/maven2/com/android/tools/build/aapt2/maven-metadata.xml | grep -oP '(?<=<latest>)[^<]+')
              wget "https://dl.google.com/dl/android/maven2/com/android/tools/build/aapt2/${VERSION}/aapt2-${VERSION}-linux.jar"
              unzip -q "aapt2-${VERSION}-linux.jar" -d /tmp/aapt2
              cp /tmp/aapt2/aapt2 build/bin/aapt2-${{ matrix.target_arch }}
              rm -rf /tmp/aapt2
              echo "✅ Used prebuilt for x86_64"
            fi
          fi

      - name: Verify binary
        run: |
          if [ -f "build/bin/aapt2-${{ matrix.target_arch }}" ]; then
            echo "✅ Binary size: $(ls -lh build/bin/aapt2-${{ matrix.target_arch }} | awk '{print $5}')"
            file build/bin/aapt2-${{ matrix.target_arch }}
            chmod +x build/bin/aapt2-${{ matrix.target_arch }}
          else
            echo "❌ Failed to build aapt2 for ${{ matrix.target_arch }}"
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aapt2-${{ matrix.target_arch }}
          path: ${{ github.workspace }}/build/bin/aapt2-*
          if-no-files-found: error
          retention-days: 30
